<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Widescreen picture detected</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="movie-format-prompt.css">
  </head>
  <body>
    <main class="prompt" role="status" aria-live="polite">
      <div class="copy">
        <h1>Widescreen picture detected</h1>
        <p id="prompt-copy">Use the detected picture area for Screen Sync?</p>
      </div>
      <div class="actions">
        <button id="keep-current" class="btn btn-sm" type="button">Keep current</button>
        <button id="use-format" class="btn btn-primary btn-sm" type="button">Use detected</button>
      </div>
      <div class="timeout" aria-hidden="true"><span></span></div>
    </main>
    <script src="movie-format-prompt.js"></script>
  </body>
</html>
